[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-paradigm"
version = "0.1.0"
description = "Fullscreen Pygame sentence, reading, and listening paradigms"
readme = "docs/readme.md"
requires-python = ">=3.10"
dependencies = [
    "pygame==2.6.1",
    "edge-tts==7.2.8",
    "mutagen==1.47.0",
    "typing-extensions==4.16.0",
]

[project.scripts]
generate-sentence-audio = "experiment_paradigm.commands.tts:main"
generate-news-audio = "experiment_paradigm.commands.tts:main_news"
run-sentence-audio = "experiment_paradigm.commands.sentence:main"
run-sentence-audio-zh = "experiment_paradigm.commands.locked_in_reading:main_zh"
run-locked-in-sentence-reading = "experiment_paradigm.commands.locked_in_reading:main_locked_in"
run-relaxing-news = "experiment_paradigm.commands.relaxing_news:main_relaxing_news"
run-reading = "experiment_paradigm.commands.reading:main_reading"
run-listening = "experiment_paradigm.commands.listening:main_listening"

[tool.setuptools.packages.find]
where = ["src"]
